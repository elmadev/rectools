name: Publish

# Tag a commit react-rec-viewer-v<version>, matching the version in
# packages/react-rec-viewer/package.json, to publish @rectools/react-rec-viewer to npm
on:
  push:
    tags: ["react-rec-viewer-v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-tools
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/react-rec-viewer/package.json').version")
          test "${GITHUB_REF_NAME}" = "react-rec-viewer-v${version}"
      - run: pnpm build
      - run: pnpm --filter @rectools/react-rec-viewer publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
