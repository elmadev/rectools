[workspace]
resolver = "3"
members = [
    "crates/elma-formats",
    "crates/replay",
    "crates/render",
    "crates/audio",
    "crates/rec2vid",
    "crates/web",
    "crates/framediff",
    "crates/game-data",
    "crates/recview",
    "crates/player",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"

[workspace.dependencies]
elma-formats = { path = "crates/elma-formats" }
replay = { path = "crates/replay" }
render = { path = "crates/render" }
audio = { path = "crates/audio" }
game-data = { path = "crates/game-data" }
player = { path = "crates/player" }
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = { version = "30", default-features = false }
pollster = "1.0"
thiserror = "2"

[profile.release]
debug = 1

# Small wasm for the browser package
[profile.web]
inherits = "release"
debug = false
lto = true
codegen-units = 1
